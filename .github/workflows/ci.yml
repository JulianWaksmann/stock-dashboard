name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run ruff
        run: ruff check .

      - name: Run pytest
        run: |
          # The tests/ directory does not exist yet in this repository, and
          # pytest exits with status 5 ("no tests collected") in that case.
          # Treat "no tests collected" as a pass so the build stays green
          # until a test suite is added, while still failing the build on
          # any other non-zero exit code (collection errors, failures, etc).
          set +e
          pytest
          status=$?
          set -e
          if [ "$status" -eq 5 ]; then
            echo "No tests were collected yet; treating as a pass."
            exit 0
          fi
          exit "$status"
