# Tema base de Streamlit.
#
# Existe para fijar el modo claro: sin este archivo, Streamlit sigue el tema
# del navegador, y en oscuro el lienzo se vuelve negro mientras los fondos de
# celda resaltada de las tablas y el `plotly_white` de los gráficos siguen
# siendo claros. El tablero está diseñado sobre fondo blanco; esto lo vuelve
# explícito en vez de dejarlo librado al sistema de quien mira.
#
# Los valores duplican tokens de `theme.py` porque Streamlit lee este archivo
# antes de importar el código: no hay forma de que los tome de ahí. Si cambiás
# uno, cambiá el otro.
[theme]
base = "light"
primaryColor = "#5b3fe4"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f3ff"
textColor = "#15132b"
font = "sans serif"
